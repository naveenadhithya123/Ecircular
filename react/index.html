<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Circular System</title>
    <link rel="icon" href="/kiot-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">' + message + '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">' + event.reason + '</div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
